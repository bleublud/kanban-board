<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="app-header">
        <h1>Kanban Board</h1>
        <div class="header-controls">
            <label for="search" class="visually-hidden">Search tasks</label>
            <input type="search" id="search" placeholder="Search tasks...">
            <button type="button" id="theme-toggle" aria-label="Toggle dark mode">Theme</button>
        </div>
    </header>

    <main>
        <section class="add task" aria-labelledby="add-task-heading">
            <h2 id="add-task-heading">Add a task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" name="title" required maxlength="80">
                </div>
                <div>
                    <label for="task-description">Description</label>
                    <textarea id="task-description" name="description" rows="3" maxlength="200"></textarea>
                </div>
                <button type="submit">Add task</button>
            </form>
        </section>

        <section class="board" aria-label="Task Board">
            <section class="column" id="todo" data-status="todo" aria-labelledby="todo-heading">
                <h2 id="todo-heading">To Do<span class="count id=todo-count">0</span></h2>
                <div class="task-list" data-status="todo"></div>
            </section>

            <section class="column" id="in-progress" data-status="in-progress" aria-labelledby="progress-heading">
                <h2 id="progress-heading">In Progress<span class="count" id="in-progress-count">0</span></h2>
                <div class="task-list" data-status="in-progress"></div>
            </section>

            <section class="column" id="done" data-status="done" aria-labelledby="done-heading">
                <h2 id="done-heading">Done<span class="count" id="done-count">0</span></h2>
                <div class="task-list" data-status="done"></div>
            </section>
        </section>
    </main>

    <footer>
        <p>Built for learning HTML, CSS and JavaScript.</p>
    </footer>
</body>
</html>
